name: DEQODE Earth Reliability Watchdog

on:
  workflow_run:
    workflows:
      - On-Demand Data Ingestion
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Update reliability incident
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const issueTitle = "[Reliability] On-Demand Data Ingestion failure";
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedJobs = jobs.jobs.filter(
              (job) => !["success", "skipped"].includes(job.conclusion)
            );
            const failedLines = failedJobs.length
              ? failedJobs.map((job) => `- ${job.name}: ${job.conclusion}`).join("\n")
              : "- No failed jobs were returned by the Actions API.";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === issueTitle
            );

            if (run.conclusion === "success") {
              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Recovered: run ${run.run_number} completed successfully.\n\n${run.html_url}`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: existing.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              return;
            }

            const body = [
              "## On-demand ingestion incident",
              "",
              `- Run: ${run.run_number}`,
              `- Conclusion: ${run.conclusion}`,
              `- Branch: ${run.head_branch}`,
              `- Commit: ${run.head_sha}`,
              `- Started: ${run.created_at}`,
              `- Workflow: ${run.html_url}`,
              "",
              "### Failed jobs",
              failedLines,
              "",
              "### Reliability agent instructions",
              "1. Inspect the failed manual refresh logs.",
              "2. Verify source-data and Supabase row quality before changing code.",
              "3. Prepare an isolated fix with tests.",
              "4. Request approval before production database cleanup, migration, push, or rerun.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body,
              });
            }
